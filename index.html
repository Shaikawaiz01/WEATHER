<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main_container">
    <div class="navbar">
      <input type="text" placeholder="enter the place" class="searchbar">
      <button class = "searchicon"><img src="icons8-search-50.png" class="icon"></button>
    </div>
<div class="image_container">
    <img class="imgg" src="clouds.png" alt="weather icon" style="width: 100%; border-radius: 20px;" />
</div>
<div class="main_content">  
  <h1 class = "temp">22°C</h1>
  <br>
  <h1 class = "city">Bangalore</h1>
</div>
<div class="cardcontainer">
  <div class="card">
    <h2>HUMIDITY</h2>
    <h2 class="humid">70%</h2>
  </div>
  <div class="card">
    <h2>Wind speed</h2>
    <h2 class="wind">22km/h</h2>
  </div>
  <div class="card">
    <h2 class = "img_text">WINDY</h2>
  </div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
